<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sign in · AdForge AI</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center}.login{width:min(430px,calc(100% - 36px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}.mark{font:700 22px 'Space Grotesk';margin-bottom:38px}.mark span{color:var(--accent)}h1{font-size:34px;letter-spacing:-.05em;margin:0 0 8px}.sub{color:var(--muted);line-height:1.5;margin-bottom:26px}.login input,.login button{width:100%;height:48px;border-radius:10px;font:inherit}.login input{border:1px solid var(--line);padding:0 14px;background:#fff;margin-bottom:10px}.login button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.login .alt{background:transparent;color:var(--muted);margin-top:8px}.msg{min-height:20px;color:var(--muted);font-size:13px;margin-top:14px}.err{color:var(--accent)}[hidden]{display:none!important}</style></head><body><main class="login"><div class="mark">Ad<span>Forge</span> AI</div><h1>Welcome back.</h1><p class="sub" id="sub">Sign in with an email code. No password required.</p><form id="form"><input id="email" type="email" placeholder="you@example.com" autocomplete="username webauthn" required><input id="code" hidden type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"><button id="submit">Continue</button><button id="back" class="alt" hidden type="button">Use a different email</button></form><div id="passkey" hidden><p class="sub">Add a passkey for faster sign-in next time.</p><button id="add">Add passkey</button><button id="skip" class="alt">Not now</button></div><div id="msg" class="msg"></div></main><script>(async()=>{const A=window.hatchable.auth,$=x=>document.getElementById(x);let step='email',has=false;const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n[0]==='/'&&!n.startsWith('//')?n:'/'};if((await A.getSession()).user){location.replace(next());return}if(A.attachPasskeyAutofill){A.attachPasskeyAutofill($('email')).then(x=>x&&x.user&&location.replace(next())).catch(()=>{})}function msg(t,e){$('msg').textContent=t;$('msg').className='msg '+(e?'err':'')}$('back').onclick=()=>{step='email';$('code').hidden=true;$('back').hidden=true;$('submit').textContent='Continue';$('sub').textContent='Sign in with an email code. No password required.';msg('');$('email').focus()};$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{if(step==='email'){const email=$('email').value.trim();const r=await A.startLogin({email});has=!!r.has_passkey;if(has&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email});if(d&&d.user){location.replace(next());return}}catch{}}step='code';$('code').hidden=false;$('back').hidden=false;$('submit').textContent='Sign in';$('sub').textContent='Enter the code sent to '+email+'.';msg('Code sent.');$('code').focus()}else{const d=await A.verifyCode({email:$('email').value.trim(),code:$('code').value.trim()});if(!d||!d.user)throw Error('Could not sign in.');if(!has&&!localStorage.getItem('adforge_passkey_declined')&&A.supportsPasskeys()){ $('form').hidden=true;$('passkey').hidden=false;return}location.replace(next())}}catch(err){msg(err.message||'Something went wrong.',true)}finally{$('submit').disabled=false}};$('add').onclick=async()=>{try{const r=await A.registerPasskey();if(!r)localStorage.setItem('adforge_passkey_declined','1')}catch{}location.replace(next())};$('skip').onclick=()=>{localStorage.setItem('adforge_passkey_declined','1');location.replace(next())};$('email').focus()})()</script></body></html>
