<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Student Sign In · YSCMT</title><link rel="stylesheet" href="/theme.css"></head><body><main class="authbox"><a href="/" style="text-decoration:none">← YSCMT Student Portal</a><div class="eyebrow" style="margin-top:24px">LEARN. BUILD. INNOVATE.</div><h1>Student Login</h1><p class="muted">Sign in or create your student account using your email address.</p><div class="tabs"><button id="loginTab">Login</button><button id="signupTab" class="secondary">Sign Up</button></div><form id="authForm"><div id="signupFields" class="hidden"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your full name"><label for="phone">Phone number</label><input id="phone" autocomplete="tel" placeholder="e.g. +234…"></div><label for="email">Email address</label><input id="email" type="email" required autocomplete="username webauthn" placeholder="you@example.com"><div id="codeFields" class="hidden"><label for="code">6-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter the code sent to your email"></div><button id="authSubmit" type="submit" style="width:100%;margin-top:18px">Continue</button><button id="backEmail" type="button" class="secondary hidden" style="width:100%;margin-top:8px">Use a different email</button></form><p id="authMsg" class="msg" role="status" aria-live="polite"></p></main><script>window.hatchable.auth.getSession().catch(function(){});</script><script src="/login.js" defer></script></body></html>
