<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Join YSCMT Connect</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf5ed,#f8faf8)}main{width:100%;max-width:430px;background:white;border:1px solid var(--border);border-radius:24px;padding:34px;box-shadow:0 20px 60px #123a2014}.brand{justify-content:center;margin-bottom:28px}.brand small{color:var(--brand)}h1{text-align:center;font-size:27px;margin:0 0 8px}.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 24px}input,button{width:100%;height:48px;border-radius:12px;font:inherit}input{border:1px solid var(--border);padding:0 14px;margin-bottom:10px}button{border:0;background:var(--brand);color:white;font-weight:750;margin-top:8px;cursor:pointer}button.alt{background:#edf5ef;color:var(--brand-dark)}.msg{min-height:24px;color:var(--muted);font-size:13px;text-align:center;margin:16px 0 0}.msg.err{color:#b42318}[hidden]{display:none!important}.back{display:block;text-align:center;color:var(--brand);margin-top:22px;font-size:13px;text-decoration:none}</style></head><body><a class="main-site-return" href="https://yscmtenterprise.ng/" aria-label="Return to the main YSCMT website">← Main YSCMT Website</a><main><a class="brand" href="/"><!-- --><span>YSCMT <small>CONNECT</small></span></a><h1 id="title">Join the community</h1><p class="sub" id="sub">Enter your email. We will send you a secure one-time sign-in code. No password needed.</p><form id="form"><div id="email-row"><input id="email" type="email" autocomplete="username webauthn" placeholder="Your email address" required></div><div id="code-row" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div><button id="submit">Continue with email</button><button type="button" id="back" class="alt" hidden>Use a different email</button></form><div id="passkey" hidden><p class="sub">Add a passkey for faster and more secure sign-in next time.</p><button id="passkey-add">Add a passkey</button><button id="passkey-skip" class="alt">Not now</button></div><p class="msg" id="msg" role="status" aria-live="polite"></p><a class="back" href="/">Back to YSCMT Connect</a></main><script>(function(){const A=window.hatchable&&window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),msg=document.getElementById('msg'),sub=document.getElementById('sub'),title=document.getElementById('title'),pass=document.getElementById('passkey'),submit=document.getElementById('submit');let step='email',hasPasskey=false;function say(t,err){msg.textContent=t||'';msg.className='msg'+(err?' err':'')}function next(){let n=new URLSearchParams(location.search).get('next')||'/';if(!n.startsWith('/')||n.startsWith('//')||n.includes('\\'))n='/';location.replace(n)}if(!A){say('Sign-in is temporarily unavailable. Please refresh.',true);submit.disabled=true;return}A.getSession().then(s=>{if(s&&s.user)next()}).catch(()=>{});document.getElementById('back').onclick=()=>{step='email';document.getElementById('email-row').hidden=false;document.getElementById('code-row').hidden=true;document.getElementById('back').hidden=true;submit.textContent='Continue with email';sub.textContent='Enter your email. We will send you a secure one-time sign-in code. No password needed.';say('')};form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email:email.value.trim()});if(d.user){next();return}}catch(_){}}step='code';document.getElementById('email-row').hidden=true;document.getElementById('code-row').hidden=false;document.getElementById('back').hidden=false;submit.textContent='Verify code';sub.textContent='Enter the 6-digit code sent to '+email.value.trim();say('Code sent. Check your inbox.');code.focus()}else{const d=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(d.user&&!hasPasskey&&!localStorage.getItem('passkey_offer_declined')&&A.supportsPasskeys()){form.hidden=true;title.textContent='You are signed in';sub.textContent='Add a passkey to sign in more quickly next time.';pass.hidden=false}else next()}}catch(err){say(err.message||'Something went wrong. Please try again.',true)}finally{submit.disabled=false}};document.getElementById('passkey-add').onclick=async()=>{try{await A.registerPasskey()}catch(_){}next()};document.getElementById('passkey-skip').onclick=()=>{localStorage.setItem('passkey_offer_declined','1');next()}})();</script></body></html>
