<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0c352b"><title>Community Moderation · YSCMT Connect</title><link rel="stylesheet" href="/theme.css"><style>body{background:#f4f7f3;color:#172820;font-family:"DM Sans",sans-serif}.wrap{max-width:1000px;margin:32px auto;padding:0 18px 60px}.head{background:#0c352b;color:#fff;border-radius:20px;padding:25px;margin-bottom:18px}.head small{color:#c7ef85;letter-spacing:2px;font-weight:800}.head h1{font:800 26px Manrope;margin:8px 0}.head p{font-size:13px;color:#d9e8df}.report{background:#fff;border:1px solid #e2e9e2;border-radius:15px;padding:17px;margin:12px 0}.report strong{color:#0c352b}.meta{font-size:11px;color:#718078;margin:6px 0 12px}.reason{font-size:13px;line-height:1.6;white-space:pre-wrap}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.controls select,.controls button{border:1px solid #dce5dc;border-radius:9px;padding:9px 12px;background:#fff;font-size:12px}.controls button{background:#0c352b;color:white;border:0;font-weight:800}.status{padding:12px;background:#fff;border:1px solid #e2e9e2;border-radius:10px;color:#66756b;font-size:13px}.back{color:#0c6547;font-weight:800;text-decoration:none;font-size:12px}</style></head><body><main class="wrap"><a class="back" href="/">← YSCMT Connect</a><header class="head"><small>YSCMT ENTERPRISE · TRUST & SAFETY</small><h1>Community moderation</h1><p>Review member reports and take proportionate action. This area is restricted to YSCMT project administrators.</p></header><div id="status" class="status">Checking administrator access…</div><section id="reports"></section></main><script>
(async function(){
 const host=document.getElementById("reports"),status=document.getElementById("status");
 const esc=v=>String(v??"");
 async function request(method,body){const r=await fetch("/api/community/moderation",{method,credentials:"same-origin",headers:{"Accept":"application/json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error||"Request failed.");return d}
 async function load(){host.replaceChildren();status.textContent="Loading open reports…";try{const d=await request("GET");status.textContent=d.reports.length?d.reports.length+" open report(s).":"No open reports. The community is all clear.";d.reports.forEach(r=>{const card=document.createElement("article");card.className="report";const title=document.createElement("strong");title.textContent=r.target_type.toUpperCase()+" report · #"+r.id;const meta=document.createElement("div");meta.className="meta";meta.textContent="Reported by "+(r.reporter_name||"member")+" · "+new Date(r.created_at).toLocaleString();const reason=document.createElement("p");reason.className="reason";reason.textContent=r.reason;const controls=document.createElement("div");controls.className="controls";const action=document.createElement("select");const choices=r.target_type==="post"?[["none","No content action"],["hide_post","Hide post"],["remove_post","Remove post"]]:r.target_type==="comment"?[["none","No content action"],["remove_comment","Remove comment"]]:[["none","No content action"],["make_profile_private","Make profile private"]];choices.forEach(([v,l])=>{const o=document.createElement("option");o.value=v;o.textContent=l;action.append(o)});const review=document.createElement("button");review.textContent="Review & close";review.onclick=async()=>{review.disabled=true;try{await request("PATCH",{id:r.id,status:"reviewed",action:action.value});load()}catch(e){alert(e.message);review.disabled=false}};const dismiss=document.createElement("button");dismiss.textContent="Dismiss";dismiss.style.background="#edf3ed";dismiss.style.color="#234b38";dismiss.onclick=async()=>{dismiss.disabled=true;try{await request("PATCH",{id:r.id,status:"dismissed",action:"none"});load()}catch(e){alert(e.message);dismiss.disabled=false}};controls.append(action,review,dismiss);card.append(title,meta,reason,controls);host.append(card)})}catch(e){status.textContent=e.message.includes("forbidden")||e.message.includes("unauthorized")?"Administrator access required. Sign in to the YSCMT project owner account, then refresh this page.":e.message}}
 await load();
})();
</script></body></html>
