<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Cybersecurity protection illustration by YSCMT Enterprise</title>
<desc id="desc">A clean, modern illustration of a secure laptop, smartphone, shield and padlock, representing safe digital habits.</desc>
<defs>
