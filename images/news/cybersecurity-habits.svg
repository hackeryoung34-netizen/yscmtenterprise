 <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#bdeeff" opacity=".17"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="750" cy="310" r="260" fill="#0b789b" opacity=".17"/><circle cx="750" cy="310" r="205" fill="none" stroke="#7fe3ff" stroke-width="2" opacity=".22"/>
