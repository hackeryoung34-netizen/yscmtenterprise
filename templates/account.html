<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08213b"><title>Customer Account | YSCMT Template Store</title>
<style>
:root{--navy:#08213b;--blue:#078db7;--paper:#f3f7fa;--line:#dce5ed;--muted:#64778a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#172b3d;font:15px/1.6 Arial,sans-serif}.wrap{width:min(560px,92%);margin:7vh auto}.brand{color:var(--navy);font-weight:800;font-size:21px;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;margin-top:20px;box-shadow:0 12px 35px #08213b0b}h1{color:var(--navy);margin:8px 0}p{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd8e3;border-radius:7px;font:inherit}button{border:0;border-radius:7px;padding:13px 16px;background:var(--navy);color:white;font-weight:700;cursor:pointer}button.secondary{background:#eaf2f7;color:var(--navy)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin-top:16px;padding:12px;border-radius:7px;background:var(--paper);white-space:pre-wrap}.small{font-size:12px}a{color:var(--blue)}
</style></head><body><main class="wrap"><a class="brand" href="/templates/">YSCMT TEMPLATE STORE</a><section class="card"><div class="small">CUSTOMER ACCOUNT</div><h1 id="heading">Sign in or create an account</h1><p>Use your email to manage your store orders and authorised downloads.</p>
<form id="authForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><div class="actions"><button id="submit" type="submit">Sign in</button><button class="secondary" id="signup" type="button">Create account</button></div></form>
<div class="actions" id="signedIn" hidden><button id="signout" class="secondary" type="button">Sign out</button><a href="/templates/">Back to templates</a></div><section id="orderHistory" hidden><h2>Your orders</h2><div id="ordersList" class="status">Loading orders…</div></section><div class="status" id="status" role="status">Loading account service…</div></section><p class="small"><a href="/templates/">← Return to Template Store</a></p></main>
<script>
let config=null;
const el=id=>document.getElementById(id), statusBox=el("status"), form=el("authForm"), submit=el("submit"), signup=el("signup");
const sessionKey="yscmt_store_session";
function show(message){statusBox.textContent=message;}
function current(){try{return JSON.parse(sessionStorage.getItem(sessionKey)||"null")}catch{return null}}
function setSession(data){if(data&&data.access_token)sessionStorage.setItem(sessionKey,JSON.stringify(data));}
function update(){const s=current();form.hidden=!!s;el("signedIn").hidden=!s;el("orderHistory").hidden=!s;el("heading").textContent=s?"You are signed in":"Sign in or create an account";if(s){show("Signed in successfully. Your customer account is ready.");loadOrders();}} 
async function loadOrders(){const s=current();if(!s||!s.access_token)return;const list=el("ordersList");list.replaceChildren();list.textContent="Loading your orders…";try{const response=await fetch("/api/orders",{headers:{Authorization:"Bearer "+s.access_token}});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to load orders.");if(!data.orders.length){list.textContent="You do not have any orders yet.";return;}list.replaceChildren();data.orders.forEach(order=>{const card=document.createElement("article");card.style.cssText="border:1px solid #dce5ed;border-radius:8px;padding:12px;margin:10px 0;background:#fff";const title=document.createElement("strong");title.textContent=(order.store_products&&order.store_products.name)||"YSCMT template";const detail=document.createElement("p");detail.textContent=order.purchase_type.replace("_"," ")+" · NGN "+Number(order.amount_ngn).toLocaleString("en-NG")+" · "+order.status.toUpperCase();const date=document.createElement("p");date.className="small";date.textContent="Order date: "+new Date(order.created_at).toLocaleString();card.append(title,detail,date);if(order.status==="paid"&&order.purchase_type==="source_code"){const button=document.createElement("button");button.type="button";button.textContent="Download ZIP";button.addEventListener("click",async()=>{button.disabled=true;button.textContent="Preparing secure link…";try{const r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token},body:JSON.stringify({order_id:order.id})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Download is unavailable.");const a=document.createElement("a");a.href=d.download_url;a.target="_blank";a.rel="noopener noreferrer";a.click();button.textContent="Download link opened";}catch(e){show(e.message);button.textContent="Download ZIP";}finally{button.disabled=false;}});card.append(button);}list.append(card);});}catch(e){list.textContent=e.message;}}
async function auth(path,payload){const r=await fetch(config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json",apikey:config.supabaseAnonKey},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||"Authentication failed.");return d;}
async function boot(){try{const r=await fetch("/api/public-config");if(!r.ok)throw new Error("Account service is not configured yet.");config=await r.json();update();if(!current())show("Sign in with your email, or create a new customer account.");}catch(e){show(e.message+" Please try again later.");submit.disabled=true;signup.disabled=true;}}
form.addEventListener("submit",async e=>{e.preventDefault();if(!config)return;submit.disabled=true;try{const data=await auth("token?grant_type=password",{email:el("email").value.trim(),password:el("password").value});setSession(data);update();}catch(e){show(e.message);}finally{submit.disabled=false;}});
signup.addEventListener("click",async()=>{if(!config)return;signup.disabled=true;try{const data=await auth("signup",{email:el("email").value.trim(),password:el("password").value});if(data.access_token){setSession(data);update();}else show("Account request received. Check your email for the confirmation link, then return here to sign in.");}catch(e){show(e.message);}finally{signup.disabled=false;}});
el("signout").addEventListener("click",()=>{const s=current();sessionStorage.removeItem(sessionKey);if(s&&s.access_token&&config)fetch(config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/logout",{method:"POST",headers:{apikey:config.supabaseAnonKey,Authorization:"Bearer "+s.access_token}}).catch(()=>{});update();show("You have signed out.");});
boot();
</script></body></html>
