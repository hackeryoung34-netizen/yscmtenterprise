<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#08213b"><title>Customer Account | YSCMT Template Store</title>
<style>
:root{--navy:#08213b;--blue:#078db7;--paper:#f3f7fa;--line:#dce5ed;--muted:#64778a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#172b3d;font:15px/1.6 Arial,sans-serif}.wrap{width:min(560px,92%);margin:7vh auto}.brand{color:var(--navy);font-weight:800;font-size:21px;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;margin-top:20px;box-shadow:0 12px 35px #08213b0b}h1{color:var(--navy);margin:8px 0}p{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #cbd8e3;border-radius:7px;font:inherit}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:7px;padding:13px 16px;background:var(--navy);color:white;font-weight:700;cursor:pointer}button.secondary{background:#eaf2f7;color:var(--navy)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin-top:16px;padding:12px;border-radius:7px;background:var(--paper);white-space:pre-wrap}.small{font-size:12px}a{color:var(--blue)}
</style></head><body><main class="wrap"><a class="brand" href="/templates/">YSCMT TEMPLATE STORE</a><section class="card"><div class="small">CUSTOMER ACCOUNT</div><h1 id="heading">Sign in or create an account</h1><p>Use your email to manage your store orders and authorised downloads.</p>
<form id="authForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><div class="actions"><button id="submit" type="submit">Sign in</button><button class="secondary" id="signup" type="button">Create account</button></div></form>
<div class="actions" id="signedIn" hidden><button id="signout" class="secondary" type="button">Sign out</button><a href="/templates/">Back to templates</a></div>
<div class="actions" id="adminActions" hidden><a href="/templates/admin.html">Open Store Admin Dashboard </a></div><section id="orderHistory" hidden><h2>Your orders</h2><div id="ordersList" class="status">Loading orders…</div></section><div class="status" id="status" role="status">Loading account service…</div></section><p class="small"><a href="/templates/"> Return to Template Store</a></p></main>
<script>
let config=null;
const el=id=>document.getElementById(id), statusBox=el("status"), form=el("authForm"), submit=el("submit"), signup=el("signup");
const sessionKey="yscmt_store_session";
function show(message){statusBox.textContent=message;}
function current(){try{return JSON.parse(sessionStorage.getItem(sessionKey)||"null")}catch{return null}}
function safeReturnTo(){const value=new URLSearchParams(window.location.search).get("return_to")||"";if(value==="/admin/"||value==="/admin")return "/admin/";return /^\/templates\/payment-callback\.html\?reference=yscmt-[0-9a-f-]{36}$/i.test(value)?value:"";}
function continueAfterLogin(){const destination=safeReturnTo();if(destination&&current()&&current().access_token){window.location.replace(destination);return true;}return false;}
function setSession(data){if(data&&data.access_token){const session={...data,expires_at:data.expires_at||Math.floor(Date.now()/1000)+(data.expires_in||3600)};sessionStorage.setItem(sessionKey,JSON.stringify(session));}}
function update(){const s=current();form.hidden=!!s;el("signedIn").hidden=!s;el("orderHistory").hidden=!s;el("adminActions").hidden=true;el("heading").textContent=s?"You are signed in":"Sign in or create an account";if(s){show("Signed in successfully. Your customer account is ready.");loadOrders();loadAdminAccess();continueAfterLogin();}}
async function loadAdminAccess(){const s=current();if(!s||!s.access_token||!config)return;try{const r=await fetch(config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/user",{headers:{apikey:config.supabaseAnonKey,Authorization:"Bearer "+s.access_token}});if(!r.ok)return;const user=await r.json();el("adminActions").hidden=!(user.app_metadata&&user.app_metadata.role==="store_admin");}catch{el("adminActions").hidden=true;}} 
async function loadOrders(){
 const s=current();if(!s||!s.access_token)return;
 const list=el("ordersList");list.replaceChildren();list.textContent="Loading your orders…";
 try{
  const response=await fetch("/api/orders",{headers:{Authorization:"Bearer "+s.access_token}});
  const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to load orders.");
  const installations=new Map((data.installations||[]).map(item=>[item.order_id,item]));
  if(!data.orders.length){list.textContent="You do not have any orders yet.";return;}
  list.replaceChildren();
  data.orders.forEach(order=>{
   const card=document.createElement("article");card.style.cssText="border:1px solid #dce5ed;border-radius:8px;padding:12px;margin:10px 0;background:#fff";
   const title=document.createElement("strong");title.textContent=(order.store_products&&order.store_products.name)||"YSCMT template";
   const detail=document.createElement("p");detail.textContent=order.purchase_type.replace("_"," ")+" · NGN "+Number(order.amount_ngn).toLocaleString("en-NG")+" · "+order.status.toUpperCase();
   const date=document.createElement("p");date.className="small";date.textContent="Order date: "+new Date(order.created_at).toLocaleString();card.append(title,detail,date);
   if(order.status==="paid"&&order.purchase_type==="source_code"){
    const button=document.createElement("button");button.type="button";button.textContent="Download ZIP";
    button.addEventListener("click",async()=>{button.disabled=true;button.textContent="Preparing secure link…";try{const r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token},body:JSON.stringify({order_id:order.id})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Download is unavailable.");const a=document.createElement("a");a.href=d.download_url;a.target="_blank";a.rel="noopener noreferrer";a.click();button.textContent="Download link opened";}catch(e){show(e.message);button.textContent="Download ZIP";}finally{button.disabled=false;}});
    card.append(button);
   }
   if(order.status==="paid"&&order.purchase_type==="installation"){
    const existing=installations.get(order.id);
    const heading=document.createElement("h3");heading.textContent="Website installation";card.append(heading);
    if(existing){
     const state=document.createElement("p");state.textContent="Request status: "+existing.status.replace("_"," ").toUpperCase();card.append(state);
     if(existing.requirements){const req=document.createElement("p");req.textContent="Your requirements: "+existing.requirements;card.append(req);}
     const note=document.createElement("p");note.className="small";note.textContent="YSCMT has received your installation request. You can follow its progress here.";card.append(note);
    }else{
     const intro=document.createElement("p");intro.textContent="Tell us what you need installed or configured for your website.";card.append(intro);
     const label=document.createElement("label");label.textContent="Installation requirements";label.htmlFor="requirements-"+order.id;
     const textarea=document.createElement("textarea");textarea.id="requirements-"+order.id;textarea.placeholder="Describe your domain, website pages, preferred design, and any special requirements…";textarea.maxLength=5000;
     const button=document.createElement("button");button.type="button";button.textContent="Submit installation request";
     button.addEventListener("click",async()=>{const requirements=textarea.value.trim();if(requirements.length<10){show("Please describe your installation requirements in at least 10 characters.");textarea.focus();return;}button.disabled=true;button.textContent="Submitting…";try{const r=await fetch("/api/installation-request",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token},body:JSON.stringify({order_id:order.id,requirements})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to submit your request.");show(d.message||"Installation request received.");await loadOrders();}catch(e){show(e.message);}finally{button.disabled=false;button.textContent="Submit installation request";}});
     card.append(label,textarea,button);
    }
   }
   list.append(card);
  });
 }catch(e){list.textContent=e.message;}
}
async function auth(path,payload){const r=await fetch(config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json",apikey:config.supabaseAnonKey},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||"Authentication failed.");return d;}
async function boot(){try{const callbackParams=new URLSearchParams(window.location.hash.slice(1));const callbackAccess=callbackParams.get("access_token");if(callbackAccess){setSession({access_token:callbackAccess,refresh_token:callbackParams.get("refresh_token"),expires_in:Number(callbackParams.get("expires_in")||3600),token_type:callbackParams.get("token_type")||"bearer"});window.history.replaceState({},document.title,window.location.pathname+window.location.search);}const callbackError=callbackParams.get("error_description")||callbackParams.get("error");if(callbackError)show("Email confirmation: "+callbackError.replace(/\+/g," "));const r=await fetch("/api/public-config");if(!r.ok)throw new Error("Account service is not configured yet.");config=await r.json();const existing=current();if(existing&&existing.refresh_token&&existing.expires_at<=Math.floor(Date.now()/1000)+60){try{const refreshed=await auth("token?grant_type=refresh_token",{refresh_token:existing.refresh_token});setSession(refreshed);}catch{sessionStorage.removeItem(sessionKey);}}update();if(!current())show("Sign in with your email, or create a new customer account.");}catch(e){show(e.message+" Please try again later.");submit.disabled=true;signup.disabled=true;}}
form.addEventListener("submit",async e=>{e.preventDefault();if(!config)return;submit.disabled=true;try{const data=await auth("token?grant_type=password",{email:el("email").value.trim(),password:el("password").value});setSession(data);update();}catch(e){show(e.message);}finally{submit.disabled=false;}});
signup.addEventListener("click",async()=>{if(!config)return;signup.disabled=true;try{const data=await auth("signup",{email:el("email").value.trim(),password:el("password").value,options:{emailRedirectTo:window.location.origin+"/templates/account.html"+(safeReturnTo()?"?return_to="+encodeURIComponent(safeReturnTo()):"")}});if(data.access_token){setSession(data);update();}else show("Account request received. Check your email for the confirmation link, then return here to sign in.");}catch(e){show(e.message);}finally{signup.disabled=false;}});
el("signout").addEventListener("click",()=>{const s=current();sessionStorage.removeItem(sessionKey);if(s&&s.access_token&&config)fetch(config.supabaseUrl.replace(/\/$/,"")+"/auth/v1/logout",{method:"POST",headers:{apikey:config.supabaseAnonKey,Authorization:"Bearer "+s.access_token}}).catch(()=>{});update();show("You have signed out.");});
boot();
</script></body></html>
