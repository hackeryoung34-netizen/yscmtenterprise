<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment confirmation | YSCMT Template Store</title><style>body{font:16px/1.6 Arial,sans-serif;background:#f3f7fa;color:#172b3d;margin:0}.card{max-width:560px;margin:9vh auto;padding:28px;background:white;border:1px solid #dce5ed;border-radius:12px;width:90%}h1{color:#08213b}p{color:#64778a}a{color:#078db7}button{padding:12px 16px;background:#08213b;color:#fff;border:0;border-radius:6px;font-weight:700;cursor:pointer}</style></head><body><main class="card"><h1>Confirming your payment</h1><p id="status">Checking your YSCMT order securely…</p><p id="actions"></p></main><script>
const key="yscmt_store_session",statusBox=document.getElementById("status"),actions=document.getElementById("actions");
const params=new URLSearchParams(location.search),reference=params.get("reference");
function accountLink(){const a=document.createElement("a");a.href="/templates/account.html";a.textContent="Open your customer account";actions.replaceChildren(a);}
async function run(){if(!reference||!/^yscmt-[0-9a-f-]{36}$/i.test(reference)){statusBox.textContent="The payment reference is missing or invalid. Check your customer account for order status.";accountLink();return;}let session;try{session=JSON.parse(sessionStorage.getItem(key)||"null")}catch{}if(!session||!session.access_token){statusBox.textContent="Your payment may still be processing. Sign in to your YSCMT customer account, then reopen this confirmation link.";accountLink();return;}try{const response=await fetch("/api/verify-payment",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({reference})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Payment could not be confirmed yet.");statusBox.textContent=data.message||"Payment confirmed.";const a=document.createElement("a");a.href="/templates/account.html";a.textContent="View your order and downloads";actions.replaceChildren(a);}catch(e){statusBox.textContent=e.message+" If you have completed payment, wait briefly and refresh this page. Do not pay again while the order is being checked.";accountLink();}}
run();
</script></body></html>
