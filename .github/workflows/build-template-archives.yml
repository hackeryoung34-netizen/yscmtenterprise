name: Build template ZIP archives

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-template-archives.yml"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build five versioned ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A folders=(
            [yscmt-ecommerce-store]="templates/ecommerce-store-v1"
            [yscmt-creative-portfolio]="templates/creative-portfolio-v1"
            [yscmt-school-lms]="templates/school-lms-v1"
            [yscmt-blog-news]="templates/blog-news-v1"
            [yscmt-admin-dashboard]="templates/admin-dashboard-v1"
          )
          for slug in "${!folders[@]}"; do
            folder="${folders[$slug]}"
            test -s "$folder/index.html"
            test -s "$folder/styles.css"
            test -s "$folder/app.js"
            test -s "$folder/README.md"
            (cd "$folder" && zip -qr "$GITHUB_WORKSPACE/dist/$slug-v1.0.0.zip" index.html styles.css app.js README.md)
            unzip -t "dist/$slug-v1.0.0.zip"
            test "$(unzip -Z1 "dist/$slug-v1.0.0.zip" | wc -l)" -eq 4
          done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload verified ZIPs and publish catalogue entries
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          slugs=(
            yscmt-ecommerce-store
            yscmt-creative-portfolio
            yscmt-school-lms
            yscmt-blog-news
            yscmt-admin-dashboard
          )
          uploaded=()
          rollback() {
            echo "Rolling catalogue rows back to draft after an incomplete publish."
            for slug in "${slugs[@]}"; do
              curl --silent --show-error --fail-with-body -X PATCH \
                "$SUPABASE_URL/rest/v1/store_products?slug=eq.$slug&status=eq.published" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=minimal" \
                --data '{"status":"draft","artifact_path":null}' || true
            done
          }
          for slug in "${slugs[@]}"; do
            file="dist/$slug-v1.0.0.zip"
            test -s "$file"
            curl --silent --show-error --fail-with-body \
              -X POST "$SUPABASE_URL/storage/v1/object/template-archives/$slug/v1.0.0.zip" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/zip" \
              -H "x-upsert: false" \
              --data-binary "@$file"
            curl --silent --show-error --fail-with-body \
              "$SUPABASE_URL/storage/v1/object/template-archives/$slug/v1.0.0.zip" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -o /tmp/"$slug".zip
            cmp "$file" /tmp/"$slug".zip
          done
          for slug in "${slugs[@]}"; do
            response="$(curl --silent --show-error --fail-with-body -X PATCH \
              "$SUPABASE_URL/rest/v1/store_products?slug=eq.$slug&status=eq.draft" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              --data "{\"artifact_path\":\"$slug/v1.0.0.zip\",\"status\":\"published\"}")" || {
                rollback
                exit 1
              }
            echo "$response" | jq -e --arg slug "$slug" 'length == 1 and .[0].slug == $slug and .[0].status == "published"' >/dev/null || {
              rollback
              exit 1
            }
          done
          echo "All five archives were uploaded, byte-verified, and published."
      - name: Report upload credentials status
        if: ${{ secrets.SUPABASE_URL == '' || secrets.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "Supabase upload skipped: repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are not both configured."
      - name: Upload archives as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yscmt-template-archives-v1.0.0
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
