<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>YSCMT Customer Referral</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#172b3d;font:15px/1.6 system-ui,sans-serif}header{background:#102f52;color:#fff;padding:22px max(18px,calc((100% - 720px)/2))}header a{color:#fff;text-decoration:none;font-weight:800}main{max-width:720px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #dce5ed;border-radius:14px;padding:22px}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{margin-top:16px;border:0;border-radius:8px;background:#12628a;color:white;padding:12px 18px;font:inherit;font-weight:700}.muted{color:#64748b}.status{margin-top:12px;white-space:pre-wrap}</style></head><body><header><a href="/">YSCMT ENTERPRISE</a><h1>Someone recommended YSCMT</h1><p>Tell us what digital service you need and our team will follow up.</p></header><main><section class="panel"><form id="form"><label>Your full name<input name="name" required maxlength="120"></label><label>Email address<input name="email" type="email" required maxlength="254"></label><label>Phone / WhatsApp<input name="phone" required maxlength="24"></label><label>What do you need?<select name="service_interest" required><option value="">Choose a service</option><option value="website_development">Website development</option><option value="ecommerce">E-commerce website</option><option value="cybersecurity">Cybersecurity</option><option value="it_training">IT training</option><option value="software">Software development</option><option value="other">Other</option></select></label><label>Tell us more (optional)<textarea name="message" rows="4" maxlength="1000"></textarea></label><div style="position:absolute;left:-10000px" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><button type="submit">Send referral enquiry</button><p id="status" class="status muted" role="status"></p></form></section><p class="muted">Submitting this form allows YSCMT Enterprise to contact you about the enquiry. Your details are handled for this business enquiry only.</p></main><script>const form=document.getElementById("form"),status=document.getElementById("status"),code=new URLSearchParams(location.search).get("code")||"";form.addEventListener("submit",async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;status.textContent="Submitting…";try{const b=Object.fromEntries(new FormData(form));b.code=code;const r=await fetch("/api/revenue?route=customer-referral",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to submit referral.");status.textContent=d.message;form.reset();}catch(x){status.textContent=x.message;}finally{button.disabled=false;}});if(!/^[A-F0-9]{16}$/.test(code)){form.querySelector("button").disabled=true;status.textContent="This referral link is invalid. Please ask your referrer for a new link.";}</script></body></html>
